name: Flutter Build CI/CD

on:
  push:
    branches:
      - main
      - master
      - fix
    tags:
      - 'v*' # Trigger when a tag starting with v is pushed, e.g. v1.0.0
  pull_request:
    branches:
      - main
      - master
      - fix
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # If your project uses .env for backend URLs, write a basic template here
      # or set secrets in GitHub Actions
      - name: Create Env File
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "VITE_API_URL=$VITE_API_URL" > .env
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Env File
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "VITE_API_URL=$VITE_API_URL" > .env
        continue-on-error: true

      # Note: Building an IPA on CI without apple distribution credentials is run with --no-codesign.
      # This compiles the source and archives it. If you need fully signed IPAs for App Store/TestFlight distribution,
      # uncomment and configure the "Install Apple Certificate" steps below.
      - name: Build IPA (Unsigned)
        run: flutter build ipa --no-codesign

      # Optional Steps for Apple Developer Code Signing:
      # To sign the app, save your Apple Distribution Cert (.p12) and Provisioning Profile (.mobileprovision) as Base64 in Secrets.
      #
      # - name: Install Apple Certificate and Provisioning Profile
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
      #     echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
      #
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #
      #     security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH
      #
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
      #
      # - name: Build Signed IPA
      #   run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA & Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa-archive
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-apk, build-ipa]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: build-artifacts/

      - name: Download IPA/Archive Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-ipa-archive
          path: build-artifacts/
        continue-on-error: true

      # Zip the .xcarchive directory so it can be uploaded as a single asset file
      - name: Zip xcarchive (iOS)
        run: |
          if [ -d "build-artifacts" ]; then
            cd build-artifacts
            find . -name "*.xcarchive" -exec zip -r Runner.xcarchive.zip {} \;
          fi
        shell: bash
        continue-on-error: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/app-release.apk
            build-artifacts/*.ipa
            build-artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

